<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DocClin</title>
  <style>
    /* Força o Iframe a ocupar 100% da tela sem barras de rolagem externas */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0f4f8;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Substitua a URL abaixo pelo link oficial do seu Apps Script (terminado em /exec) -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwjWICqzzJc2u30nft2Fy0ZPl2eQ6YdvOCe5U65iZRc8sjGsaxLn9HPsjKheXb2Uaob/exec" 
    allow="downloads; camera; microphone">
  </iframe>

</body>
</html>
